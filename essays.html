<body>
    <!--
      Essays are authored in the Telegram channel @solemn_leaderr and rendered
      statically here so the page is crawlable and works without JavaScript.
      The script below tries to refresh from Telegram, but only replaces the
      content on a successful fetch — a CORS/network failure leaves the static
      content below untouched.
    -->
    <div id="app">
        <a href="index.html" class="nav-link">← Daniil Zimerman</a>
        <h1 class="title">Essays</h1>

        <article>
            <h2>Заголовок</h2>
            <div class="article-content">Умная мысль 1. Умная мысль 1. Умная мысль 1. Умная мысль 1.<br><br>Smart thought 2. Smart thought 2. Smart thought 2. Smart thought 2.</div>
        </article>

        <article>
            <h2>бебебе</h2>
            <div class="article-content">бебебе</div>
        </article>

        <div class="footer">
            <a href="https://t.me/solemn_leaderr" target="_blank" rel="noopener">source</a>
        </div>
    </div>

    <script>
        const TELEGRAM_CHANNEL = "solemn_leaderr";
        const TELEGRAM_URL = `https://t.me/s/${TELEGRAM_CHANNEL}`;

        async function fetchArticles() {
            const response = await fetch(TELEGRAM_URL);
            const html = await response.text();
            const doc = new DOMParser().parseFromString(html, "text/html");

            const articles = [];
            doc.querySelectorAll(".tgme_widget_message_text").forEach(messageText => {
                const text = messageText.textContent.trim();
                if (!text || text.includes("Channel created")) return;

                const bold = messageText.querySelector("b");
                let header, content;
                if (bold) {
                    header = bold.textContent.trim();
                    const clone = messageText.cloneNode(true);
                    const cloneBold = clone.querySelector("b");
                    if (cloneBold) cloneBold.remove();
                    content = clone.innerHTML.trim();
                } else {
                    header = text.split("\n")[0];
                    content = messageText.innerHTML.trim();
                }
                content = content.replace(/^(<br\s*\/?>)+/i, "").replace(/(<br\s*\/?>)+$/i, "");
                articles.push({ title: header, content: content });
            });
            return articles;
        }

        function render(articles) {
            const app = document.getElementById("app");
            const items = articles.map(a => `
                <article>
                    <h2>${a.title}</h2>
                    <div class="article-content">${a.content}</div>
                </article>`).join("");
            app.innerHTML = `
                <a href="index.html" class="nav-link">← Daniil Zimerman</a>
                <h1 class="title">Essays</h1>
                ${items}
                <div class="footer">
                    <a href="https://t.me/${TELEGRAM_CHANNEL}" target="_blank" rel="noopener">source</a>
                </div>`;
        }

        // Progressive enhancement: refresh from Telegram, but only on success.
        // On failure (e.g. CORS), keep the static content already in the page.
        fetchArticles()
            .then(articles => { if (articles && articles.length) render(articles); })
            .catch(() => { /* keep static content */ });
    </script>
</body>
